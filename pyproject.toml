[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "portfell"
version = "0.1.0"
description = "Single-user ETF portfolio research tooling with external read-only PostgreSQL market data."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cryptography>=45.0.0",
    "dash>=4.4.1",
    "anyio>=4.4.0,<4.15.0",
    "fastapi>=0.116.0",
    "numpy>=2.3.0",
    "plotly>=6.5.0",
    "polars>=1.43.2",
    "psycopg[binary]>=3.2.9",
    "uvicorn>=0.35.0",
]

[project.scripts]
portfell-docs-refresh = "portfell.docs_refresh:main"
portfell-quality = "portfell.quality:main"
portfell-market-refresh = "portfell.market_source.refresh:main"
portfell-univariate-refresh = "portfell.univariate_refresh:main"

[dependency-groups]
dev = [
    "httpx2>=0.28.0",
    "import-linter>=2.13",
    "playwright>=1.50.0",
    "pre-commit>=4.2.0",
    "pyright>=1.1.411",
    "pytest>=8.4.0",
    "pytest-cov>=6.2.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.12.0",
]

[tool.hatch.build.targets.wheel]
packages = [
    "src/portfell",
    "src/portfell_contracts",
    "src/portfell_artifacts",
    "src/portfell_workflow",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]
markers = [
    "browser: deterministic Python Playwright browser acceptance",
    "real_stack: Playwright acceptance against the running Docker/PostgreSQL stack",
]

[tool.coverage.run]
relative_files = true
source = ["src/portfell"]
omit = [
    "src/portfell/app_services/workspace.py",
    "src/portfell/app_services/analysis_compute.py",
    "src/portfell/univariate_refresh.py",
    "src/portfell/run_locks.py",
    "src/portfell/selection_filters.py",
]

[tool.coverage.report]
fail_under = 92

[tool.pyright]
include = ["src"]
pythonVersion = "3.14"
typeCheckingMode = "strict"

[tool.importlinter]
root_package = "portfell"

[[tool.importlinter.contracts]]
name = "Evaluation does not depend on ingestion"
type = "forbidden"
source_modules = ["portfell.evaluation", "portfell.evaluation_parts"]
forbidden_modules = [
    "portfell.bronze",
    "portfell.cli",
    "portfell.http",
    "portfell.search",
    "portfell.silver",
]

[[tool.importlinter.contracts]]
name = "Shared infrastructure does not depend on workflow modules"
type = "forbidden"
source_modules = [
    "portfell.logging",
    "portfell.paths",
    "portfell.run_locks",
    "portfell.run_state",
    "portfell.schemas",
    "portfell.table_io",
]
forbidden_modules = [
    "portfell.bronze",
    "portfell.cli",
    "portfell.evaluation",
    "portfell.gold",
    "portfell.portfolio",
    "portfell.search",
    "portfell.silver",
]

[[tool.importlinter.contracts]]
name = "Clean application services do not depend on HTTP composition or Dash"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["portfell.app_services"]
forbidden_modules = [
    "portfell.dash_app",
    "portfell.hosted_api",
    "portfell.hosted_routes_metadata_projects",
    "portfell.hosted_routes_research",
]

[[tool.importlinter.contracts]]
name = "Dash does not depend on concrete database connection adapters"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["portfell.dash_app"]
forbidden_modules = [
    "portfell.hosted_database_connection",
    "portfell.market_source.connection",
]
