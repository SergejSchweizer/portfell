[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "portfell"
version = "0.1.0"
description = "Single-user ETF portfolio research tooling with external read-only PostgreSQL market data."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cryptography>=45.0.0",
    "fastapi>=0.116.0",
    "polars>=1.43.2",
    "psycopg[binary]>=3.2.9",
    "uvicorn>=0.35.0",
]

[project.scripts]
portfell-docs-refresh = "portfell.docs_refresh:main"
portfell-quality = "portfell.quality:main"
portfell-compose-web-watch = "portfell.compose_web_watch:main"
portfell-compose-watch = "portfell.compose_web_watch:main"

[dependency-groups]
dev = [
    "httpx2>=0.28.0",
    "import-linter>=2.13",
    "pre-commit>=4.2.0",
    "pyright>=1.1.411",
    "pytest>=8.4.0",
    "pytest-cov>=6.2.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.12.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/portfell"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.14"
typeCheckingMode = "strict"

[tool.importlinter]
root_package = "portfell"

[[tool.importlinter.contracts]]
name = "Evaluation does not depend on ingestion"
type = "forbidden"
source_modules = ["portfell.evaluation", "portfell.evaluation_parts"]
forbidden_modules = [
    "portfell.bronze",
    "portfell.cli",
    "portfell.http",
    "portfell.search",
    "portfell.silver",
]

[[tool.importlinter.contracts]]
name = "Shared infrastructure does not depend on workflow modules"
type = "forbidden"
source_modules = [
    "portfell.logging",
    "portfell.paths",
    "portfell.run_locks",
    "portfell.run_state",
    "portfell.schemas",
    "portfell.table_io",
]
forbidden_modules = [
    "portfell.bronze",
    "portfell.cli",
    "portfell.evaluation",
    "portfell.gold",
    "portfell.portfolio",
    "portfell.search",
    "portfell.silver",
]

[[tool.importlinter.contracts]]
name = "Hosted API contracts and state do not depend on API composition"
type = "forbidden"
source_modules = [
    "portfell.hosted_api_contracts",
    "portfell.hosted_api_state",
]
forbidden_modules = [
    "portfell.hosted_api",
]

[[tool.importlinter.contracts]]
name = "Hosted routes do not depend on runtime implementations"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
    "portfell.hosted_routes_common",
    "portfell.hosted_routes_credentials",
    "portfell.hosted_routes_metadata_projects",
    "portfell.hosted_routes_quote_runs",
    "portfell.hosted_routes_research",
]
forbidden_modules = [
    "portfell.bronze",
    "portfell.hosted_api",
    "portfell.hosted_credentials",
    "portfell.hosted_workspace",
    "portfell.metadata_builder",
    "portfell.paths",
    "portfell.silver",
    "portfell.table_io",
    "portfell.workflows",
]

[[tool.importlinter.contracts]]
name = "Hosted application services do not depend on HTTP or concrete runtime adapters"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
    "portfell.hosted_api_service_support",
    "portfell.hosted_credential_project_service",
    "portfell.hosted_metadata_project_service",
    "portfell.hosted_quote_run_service",
    "portfell.hosted_analysis_service",
    "portfell.hosted_bivariate_service",
    "portfell.hosted_research_service",
    "portfell.hosted_univariate_service",
]
forbidden_modules = [
    "portfell.hosted_api",
    "portfell.hosted_routes_common",
    "portfell.hosted_routes_credentials",
    "portfell.hosted_routes_metadata_projects",
    "portfell.hosted_routes_quote_runs",
    "portfell.hosted_routes_research",
    "portfell.hosted_research_persistence",
    "portfell.hosted_research_repository",
    "portfell.metadata_builder",
    "portfell.paths",
    "portfell.workflows",
]

[[tool.importlinter.contracts]]
name = "Hosted ports and values do not depend on services or routes"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
    "portfell.hosted_api_contracts",
    "portfell.hosted_api_errors",
    "portfell.hosted_api_ports",
    "portfell.hosted_research_ports",
]
forbidden_modules = [
    "portfell.hosted_api",
    "portfell.hosted_api_service_support",
    "portfell.hosted_analysis_service",
    "portfell.hosted_bivariate_service",
    "portfell.hosted_credential_project_service",
    "portfell.hosted_metadata_project_service",
    "portfell.hosted_quote_run_service",
    "portfell.hosted_research_persistence",
    "portfell.hosted_research_repository",
    "portfell.hosted_research_service",
    "portfell.hosted_univariate_service",
    "portfell.hosted_routes_common",
    "portfell.hosted_routes_credentials",
    "portfell.hosted_routes_metadata_projects",
    "portfell.hosted_routes_quote_runs",
    "portfell.hosted_routes_research",
]
