name: portfell

services:
  postgres:
    container_name: portfell-postgres
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: portfell
      POSTGRES_USER: portfell_app
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      PGDATA: /var/lib/postgresql/data/pgdata
    secrets: [postgres_password]
    volumes:
      - portfell-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfell_app -d portfell"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [portfell-internal]
    expose: ["5432"]
    read_only: true
    tmpfs: [/tmp, /run, /var/run/postgresql]
    security_opt: [no-new-privileges:true]

  app:
    container_name: portfell-app
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      PORTFELL_ENV: development
      PORTFELL_HOSTED_AUTHORITY: postgres
      PORTFELL_DATABASE_URL: postgresql://portfell_app@postgres:5432/portfell
      PORTFELL_DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      PORTFELL_SHARED_DATA_ROOT: /srv/portfell/shared-data
      PORTFELL_EODHD_KEK_FILE: /run/secrets/eodhd_kek
    secrets: [eodhd_kek, postgres_password]
    volumes:
      - portfell-shared-data:/srv/portfell/shared-data
    depends_on:
      postgres:
        condition: service_healthy
      project-bootstrap-worker:
        condition: service_healthy
    ports:
      - "0.0.0.0:${PORTFELL_APP_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-m", "portfell.hosted_runtime", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [portfell-internal, portfell-public]
    group_add: ["${PORTFELL_SECRET_GROUP_ID:-100}"]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  project-bootstrap-worker:
    container_name: portfell-worker
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    command:
      - sh
      - -c
      - >-
        python -m portfell.hosted_catalog_migration
        && python -m portfell.multivariate_decision_migration
        && touch /tmp/catalog-migrated
        && exec python -m portfell.hosted_project_bootstrap_worker
    environment:
      PORTFELL_SHARED_DATA_ROOT: /srv/portfell/shared-data
      PORTFELL_DATABASE_URL: postgresql://portfell_app@postgres:5432/portfell
      PORTFELL_DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      PORTFELL_OPERATIONS_EODHD_TOKEN_FILE: /run/secrets/operations_eodhd_token
    secrets: [operations_eodhd_token, postgres_password]
    volumes:
      - portfell-shared-data:/srv/portfell/shared-data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/catalog-migrated"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 10s
    networks: [portfell-internal, portfell-public]
    group_add: ["${PORTFELL_SECRET_GROUP_ID:-100}"]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

networks:
  portfell-internal:
    internal: true
  portfell-public:

volumes:
  portfell-postgres-data:
  portfell-shared-data:

secrets:
  postgres_password:
    file: ${PORTFELL_POSTGRES_PASSWORD_FILE:?set an absolute external secret path}
  eodhd_kek:
    file: ${PORTFELL_EODHD_KEK_FILE:?set an absolute external secret path}
  operations_eodhd_token:
    file: ${PORTFELL_OPERATIONS_EODHD_TOKEN_FILE:?set an absolute external secret path}
