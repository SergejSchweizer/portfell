name: portfell

services:
  postgres:
    container_name: portfell-postgres
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: portfell_dash
      POSTGRES_USER: portfell_app
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      PGDATA: /var/lib/postgresql/data/pgdata
    secrets:
      - postgres_password
    volumes:
      - portfell-dash-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfell_app -d portfell_dash"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - portfell-internal
    expose:
      - "5432"
    read_only: true
    tmpfs:
      - /tmp
      - /run
      - /var/run/postgresql
    security_opt:
      - no-new-privileges:true

  api:
    container_name: portfell-app
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      PORTFELL_ENV: production
      PORTFELL_CONFIG_PATH: /run/portfell/config.yaml
      PORTFELL_DATABASE_URL: postgresql://portfell_app@postgres:5432/portfell_dash
      PORTFELL_DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      PORTFELL_MARKET_DATA_ROOT: /var/lib/portfell/market-data
    secrets:
      - postgres_password
    volumes:
      - ./config.yaml:/run/portfell/config.yaml:ro
      - ${PORTFELL_MARKET_DATA_ROOT:-./.market-data}:/var/lib/portfell/market-data:ro
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "0.0.0.0:${PORTFELL_PORT:-8080}:8000"
    healthcheck:
      test: ["CMD", "python", "-m", "portfell.hosted_runtime", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - portfell-internal
      - portfell-public
    group_add:
      - "${PORTFELL_SECRET_GROUP_ID:-100}"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  portfell-internal:
    internal: true
  portfell-public:

volumes:
  portfell-dash-postgres-data:

secrets:
  postgres_password:
    file: ${PORTFELL_POSTGRES_PASSWORD_FILE:?set an absolute external secret path}
