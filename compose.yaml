name: portfell

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: portfell
      POSTGRES_USER: portfell_app
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      PGDATA: /var/lib/postgresql/data/pgdata
    secrets:
      - postgres_password
    volumes:
      - portfell-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfell_app -d portfell"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - portfell-internal
    expose:
      - "5432"
    read_only: true
    tmpfs:
      - /tmp
      - /run
      - /var/run/postgresql
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      PORTFELL_ENV: development
      PORTFELL_DATABASE_URL: postgresql://portfell_app@postgres:5432/portfell
      PORTFELL_SHARED_DATA_ROOT: /srv/portfell/shared-data
      PORTFELL_LAKE_ROOT: /srv/portfell/lake
      PORTFELL_EODHD_KEK_FILE: /run/secrets/eodhd_kek
    secrets:
      - eodhd_kek
    volumes:
      - portfell-shared-data:/srv/portfell/shared-data
      - ./lake:/srv/portfell/lake
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "0.0.0.0:${PORTFELL_API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-m", "portfell.hosted_runtime", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - portfell-internal
      - portfell-public
    group_add:
      - "${PORTFELL_LAKE_GROUP_ID:-10}"
      - "${PORTFELL_SECRET_GROUP_ID:-100}"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    develop:
      watch:
        - action: rebuild
          path: ./apps/web
        - action: rebuild
          path: ./apps/web/Dockerfile
        - action: rebuild
          path: ./compose.yaml
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORTFELL_API_BASE_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "0.0.0.0:${PORTFELL_WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "server.js", "--health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - portfell-public
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

networks:
  portfell-internal:
    internal: true
  portfell-public:

volumes:
  portfell-postgres-data:
  portfell-shared-data:

secrets:
  postgres_password:
    file: ${PORTFELL_POSTGRES_PASSWORD_FILE:?set an absolute external secret path}
  eodhd_kek:
    file: ${PORTFELL_EODHD_KEK_FILE:?set an absolute external secret path}
