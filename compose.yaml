name: portfell

services:
  postgres:
    container_name: portfell-postgress
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: portfell
      POSTGRES_USER: portfell_app
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      PGDATA: /var/lib/postgresql/data/pgdata
    secrets:
      - postgres_password
    volumes:
      - portfell-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfell_app -d portfell"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - portfell-internal
    expose:
      - "5432"
    read_only: true
    tmpfs:
      - /tmp
      - /run
      - /var/run/postgresql
    security_opt:
      - no-new-privileges:true

  api:
    container_name: portfell-api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      PORTFELL_ENV: development
      PORTFELL_HOSTED_AUTHORITY: postgres
      PORTFELL_CONFIG_PATH: /run/portfell/config.yaml
      PORTFELL_DATABASE_URL: postgresql://portfell_app@postgres:5432/portfell
      PORTFELL_DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      PORTFELL_MARKET_DATABASE_URL: ${PORTFELL_MARKET_DATABASE_URL:?set the external xetra-loader PostgreSQL DSN}
      PORTFELL_MARKET_DATABASE_PASSWORD_FILE: /run/secrets/market_postgres_password
    secrets:
      - postgres_password
      - market_postgres_password
    volumes:
      - ./config.yaml:/run/portfell/config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "0.0.0.0:${PORTFELL_API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-m", "portfell.hosted_runtime", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - portfell-internal
      - portfell-public
    group_add:
      - "${PORTFELL_SECRET_GROUP_ID:-100}"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  web:
    container_name: portfell-web
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    develop:
      watch:
        - action: rebuild
          path: ./apps/web
        - action: rebuild
          path: ./apps/web/Dockerfile
        - action: rebuild
          path: ./compose.yaml
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORTFELL_API_BASE_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "0.0.0.0:${PORTFELL_WEB_PORT:-333}:3000"
    healthcheck:
      test: ["CMD", "node", "server.js", "--health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - portfell-public
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  portfell-internal:
    internal: true
  portfell-public:

volumes:
  portfell-postgres-data:

secrets:
  postgres_password:
    file: ${PORTFELL_POSTGRES_PASSWORD_FILE:?set an absolute external secret path}
  market_postgres_password:
    file: ${PORTFELL_MARKET_POSTGRES_PASSWORD_FILE:?set an absolute external market secret path}
