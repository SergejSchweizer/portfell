name: portfell

# Independent-process deployment profile. The default compose.yaml remains the
# compact development stack; this file is used with `docker compose -f
# compose.modules.yaml up -d --build` for the four-module topology.
services:
  postgres:
    container_name: portfell-postgres
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: portfell_dash
      POSTGRES_USER: portfell_app
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes: [portfell-dash-postgres-data:/var/lib/postgresql/data]
    expose: ["5432"]
    networks: [portfell-internal]

  gateway:
    container_name: portfell-gateway
    build: {context: ., dockerfile: apps/api/Dockerfile}
    command: ["python", "-m", "portfell.services.process", "gateway"]
    ports: ["0.0.0.0:${PORTFELL_PORT:-8080}:8000"]
    networks: [portfell-internal, portfell-public]
    depends_on: [postgres]

  metadata:
    container_name: portfell-metadata
    build: {context: ., dockerfile: apps/api/Dockerfile}
    command: ["python", "-m", "portfell.services.process", "metadata"]
    expose: ["8000"]
    networks: [portfell-internal]
    volumes: ["${PORTFELL_MARKET_DATA_ROOT:-/volume2/docker/portfell/market-data}:/var/lib/portfell/market-data:ro"]

  univariate:
    container_name: portfell-univariate
    build: {context: ., dockerfile: apps/api/Dockerfile}
    command: ["python", "-m", "portfell.services.process", "univariate"]
    expose: ["8000"]
    networks: [portfell-internal]
    volumes: ["${PORTFELL_MARKET_DATA_ROOT:-/volume2/docker/portfell/market-data}:/var/lib/portfell/market-data:ro"]

  bivariate:
    container_name: portfell-bivariate
    build: {context: ., dockerfile: apps/api/Dockerfile}
    command: ["python", "-m", "portfell.services.process", "bivariate"]
    expose: ["8000"]
    networks: [portfell-internal]
    volumes: ["${PORTFELL_MARKET_DATA_ROOT:-/volume2/docker/portfell/market-data}:/var/lib/portfell/market-data:ro"]

  multivariate:
    container_name: portfell-multivariate
    build: {context: ., dockerfile: apps/api/Dockerfile}
    command: ["python", "-m", "portfell.services.process", "multivariate"]
    expose: ["8000"]
    networks: [portfell-internal]
    volumes: ["${PORTFELL_MARKET_DATA_ROOT:-/volume2/docker/portfell/market-data}:/var/lib/portfell/market-data:ro"]

networks:
  portfell-internal:
    internal: true
  portfell-public: {}

volumes:
  portfell-dash-postgres-data: {}

secrets:
  postgres_password:
    file: ${PORTFELL_POSTGRES_PASSWORD_FILE:?set an absolute external secret path}
