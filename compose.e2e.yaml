name: portfell-e2e

services:
  postgres:
    container_name: portfell-e2e-postgres
    restart: "no"
    ports: []
    volumes:
      - portfell-e2e-postgres:/var/lib/postgresql/data

  seed-user:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command:
      - python
      - -c
      - >-
        import os; from portfell.hosted_database_connection import connect;
        c = connect(os.environ['PORTFELL_DATABASE_URL'], autocommit=False);
        c.execute("select set_config(%s, %s, true)", ('portfell.current_user_id', '00000000-0000-5000-8000-000000000001'));
        c.execute("insert into portfell_app.users (user_id, status) values (%s::uuid, 'active') on conflict (user_id) do nothing", ('00000000-0000-5000-8000-000000000001',)); c.commit(); c.close()
    environment:
      PORTFELL_DATABASE_URL: postgresql://portfell_app@postgres:5432/portfell
      PORTFELL_DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    networks:
      - portfell-internal
    group_add:
      - "${PORTFELL_SECRET_GROUP_ID:-100}"

  api:
    container_name: portfell-e2e-api
    restart: "no"
    depends_on:
      seed-user:
        condition: service_completed_successfully
    ports: !override
      - "127.0.0.1:18000:8000"

  web:
    container_name: portfell-e2e-web
    restart: "no"
    depends_on:
      api:
        condition: service_healthy
    ports: !override
      - "127.0.0.1:13000:3000"

volumes:
  portfell-e2e-postgres:

secrets:
  postgres_password:
    file: ./tests/e2e/secrets/postgres_password.txt
