name: pr-quality

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTEST_SHARD_COUNT: 4

jobs:
  lint:
    name: pr-lint-quality
    runs-on: ubuntu-latest
    steps: &python-steps
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: astral-sh/setup-uv@v6
        with: {enable-cache: true}
      - run: uv python install
      - run: uv sync --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python -m portfell.security_gates
      - run: uv run portfell-quality --commits-only
      - if: github.event_name == 'pull_request'
        env:
          SQUASH_SUBJECT: ${{ github.event.pull_request.title }}
        run: uv run portfell-quality --squash-subject "$SQUASH_SUBJECT"

  type:
    name: pr-type-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install
      - run: uv sync --dev
      - run: uv run pyright

  unit:
    name: pr-unit-tests-${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: {shard: [1, 2, 3, 4]}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install
      - run: uv sync --dev
      - run: uv run python scripts/pytest_shard.py --suite unit --shard-index ${{ matrix.shard }} --shard-count 4 -- -q -n auto

  integration:
    name: pr-integration-tests-${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: {shard: [1, 2, 3, 4]}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install
      - run: uv sync --dev
      - run: uv run python scripts/pytest_shard.py --suite integration --shard-index ${{ matrix.shard }} --shard-count 4 -- -q -n auto

  dash-image:
    name: pr-dash-app-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --file apps/api/Dockerfile --tag portfell-app:pr .
      - run: docker compose config --quiet

  aggregate:
    name: pr-quality
    if: always()
    needs: [lint, type, unit, integration, dash-image]
    runs-on: ubuntu-latest
    steps:
      - name: Require every parallel gate
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          test "$(echo "$RESULTS" | tr ' ' '\n' | grep -vc '^success$')" -eq 0
