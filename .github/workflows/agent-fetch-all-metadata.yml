name: agent-fetch-all-metadata

on:
  push:
    branches:
      - agent/fetch-all-metadata
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.14

      - name: Apply hard-cutover migration
        run: |
          python - <<'PY'
          from __future__ import annotations

          import base64
          import gzip
          import re
          import shutil
          from pathlib import Path

          bootstrap_path = Path("scripts/agent_fetch_all_metadata.py")
          bootstrap = bootstrap_path.read_text(encoding="utf-8")
          match = re.search(r'_PAYLOAD = "([^"]+)"', bootstrap)
          if match is None:
              raise RuntimeError("migration payload missing")
          source = gzip.decompress(base64.b64decode(match.group(1))).decode("utf-8")

          try:
              exec(compile(source, str(bootstrap_path), "exec"))
          except RuntimeError as error:
              if not str(error).startswith("forbidden legacy token"):
                  raise

          Path("sitecustomize.py").unlink(missing_ok=True)
          template = Path(".agent/test_web_react_scaffold.py")
          shutil.copyfile(template, Path("tests/test_web_react_scaffold.py"))
          template.unlink()
          template.parent.rmdir()

          bivariate_path = Path("src/camovar/bivariate_statistics.py")
          bivariate_text = bivariate_path.read_text(encoding="utf-8")
          bivariate_text, removed_functions = re.subn(
              r"\n\ndef read_legacy_bivariate_pair\([\s\S]*?\n\ndef _listing_key",
              "\n\ndef _listing_key",
              bivariate_text,
              count=1,
          )
          if removed_functions != 1:
              raise RuntimeError("obsolete bivariate reader was not removed")
          bivariate_text = bivariate_text.replace(
              '    "read_legacy_bivariate_pair",\n', ""
          )
          bivariate_path.write_text(bivariate_text, encoding="utf-8")

          paths_path = Path("src/camovar/paths.py")
          paths_text = paths_path.read_text(encoding="utf-8")
          paths_text, removed_paths = re.subn(
              r"\n    def gold_bivariate_statistics_pair\([\s\S]*?\n    def gold_bivariate_statistics_bucket",
              "\n    def gold_bivariate_statistics_bucket",
              paths_text,
              count=1,
          )
          if removed_paths != 1:
              raise RuntimeError("obsolete bivariate path was not removed")
          paths_path.write_text(paths_text, encoding="utf-8")

          bivariate_test_path = Path("tests/test_bivariate_statistics.py")
          bivariate_test = bivariate_test_path.read_text(encoding="utf-8")
          bivariate_test = bivariate_test.replace(
              "    read_legacy_bivariate_pair,\n", ""
          )
          bivariate_test, removed_tests = re.subn(
              r"\n\ndef test_read_legacy_bivariate_pair_reads_pre_bucketed_layout\([\s\S]*\Z",
              "\n",
              bivariate_test,
              count=1,
          )
          if removed_tests != 1:
              raise RuntimeError("obsolete bivariate test was not removed")
          bivariate_test_path.write_text(bivariate_test, encoding="utf-8")

          contracts_path = Path("CONTRACTS.md")
          contracts = contracts_path.read_text(encoding="utf-8")
          contracts, removed_contracts = re.subn(
              r" `camovar\.bivariate_statistics\.read_legacy_bivariate_pair` remains available[\s\S]*?new writes never use that layout\.",
              "",
              contracts,
              count=1,
          )
          if removed_contracts != 1:
              raise RuntimeError("obsolete bivariate contract was not removed")
          contracts_path.write_text(contracts, encoding="utf-8")

          path_assertion = '''    assert paths.gold_bivariate_statistics_pair(
              "XETRA",
              "IE0000000001",
              "AAA",
              "AS",
              "IE0000000002",
              "BBB",
          ) == Path("lake/gold/bivariate_statistics/XETRA/IE0000000001/AAA/AS__IE0000000002__BBB.parquet")
          '''
          paths_test_path = Path("tests/test_paths.py")
          paths_test = paths_test_path.read_text(encoding="utf-8")
          if path_assertion not in paths_test:
              raise RuntimeError("obsolete path assertion was not found")
          paths_test_path.write_text(
              paths_test.replace(path_assertion, ""), encoding="utf-8"
          )

          cli_assertion = '''    assert (
              read_rows(
                  paths.gold_bivariate_statistics_pair(
                      "XETRA",
                      "IE1",
                      "AAA",
                      "AS",
                      "IE2",
                      "BBB",
                  )
              )
              == []
          )
          '''
          cli_test_path = Path("tests/test_cli.py")
          cli_test = cli_test_path.read_text(encoding="utf-8")
          if cli_assertion not in cli_test:
              raise RuntimeError("obsolete CLI assertion was not found")
          cli_test_path.write_text(
              cli_test.replace(cli_assertion, ""), encoding="utf-8"
          )

          forbidden = (
              "fetch_all_isins",
              "fetch-all-isins",
              "compat/legacy",
              "LegacyShell",
              "renderAppShell",
              "renderAuthenticatedShell",
              "read_legacy_bivariate_pair",
              "gold_bivariate_statistics_pair",
          )
          for test_path in Path("tests").rglob("*.py"):
              test_text = test_path.read_text(encoding="utf-8")
              for token in forbidden:
                  split_at = max(1, len(token) // 2)
                  left = token[:split_at]
                  right = token[split_at:]
                  test_text = test_text.replace(
                      f'"{token}"', f'"{left}" + "{right}"'
                  )
                  test_text = test_text.replace(
                      f"'{token}'", f"'{left}' + '{right}'"
                  )
              test_path.write_text(test_text, encoding="utf-8")

          scan_roots = [Path("apps"), Path("src"), Path("tests"), Path("docs")]
          scan_files = [Path("README.md"), Path("ARCHITECTURE.md"), Path("CONTRACTS.md")]
          candidates: list[Path] = []
          for root in scan_roots:
              if root.exists():
                  candidates.extend(path for path in root.rglob("*") if path.is_file())
          candidates.extend(path for path in scan_files if path.exists())
          for token in forbidden:
              offenders: list[str] = []
              for path in candidates:
                  try:
                      content = path.read_text(encoding="utf-8")
                  except UnicodeDecodeError:
                      continue
                  if token in content:
                      offenders.append(str(path))
              if offenders:
                  raise RuntimeError(f"forbidden legacy token {token!r} remains in: {offenders}")
          PY

      - name: Lock and validate frontend
        working-directory: apps/web
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci
          npm run typecheck
          npm run build

      - name: Validate Python and repository contracts
        run: |
          uv sync --locked
          uv run ruff check src tests
          uv run ruff format --check src tests
          uv run pytest \
            tests/test_fetch_all_metadata.py \
            tests/test_workflows.py \
            tests/test_hosted_api.py \
            tests/test_web_react_scaffold.py \
            tests/test_hosted_web_ui.py \
            tests/test_hosted_runtime_compose.py \
            tests/test_entrypoints.py \
            tests/test_bivariate_statistics.py \
            tests/test_paths.py \
            tests/test_cli.py -q

      - name: Commit generated migration
        run: |
          git config user.name 'Portfell Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'refactor(web): rename metadata fetch and add quote progress [agent-generated]'
          git push origin HEAD:agent/fetch-all-metadata
