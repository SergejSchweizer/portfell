name: agent-fetch-all-metadata

on:
  push:
    branches:
      - agent/fetch-all-metadata
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.14

      - name: Apply hard-cutover migration
        run: |
          python - <<'PY'
          from __future__ import annotations

          import base64
          import gzip
          import re
          from pathlib import Path

          bootstrap_path = Path("scripts/agent_fetch_all_metadata.py")
          bootstrap = bootstrap_path.read_text(encoding="utf-8")
          match = re.search(r'_PAYLOAD = "([^"]+)"', bootstrap)
          if match is None:
              raise RuntimeError("migration payload missing")
          source = gzip.decompress(base64.b64decode(match.group(1))).decode("utf-8")

          try:
              exec(compile(source, str(bootstrap_path), "exec"))
          except RuntimeError as error:
              if not str(error).startswith("forbidden legacy token"):
                  raise

          Path("tests/test_web_react_scaffold.py").write_text(
              '''from __future__ import annotations

import json
from pathlib import Path

REPOSITORY_ROOT = Path(__file__).resolve().parents[1]
WEB_ROOT = REPOSITORY_ROOT / "apps" / "web"


def test_web_has_exactly_four_research_pages() -> None:
    routes = (WEB_ROOT / "src" / "routes.tsx").read_text(encoding="utf-8")
    expected = (
        "/metadata-filter",
        "/univariate-statistics",
        "/univariate-filter",
        "/bivariate-statistics",
    )
    for route in expected:
        assert f'path: "{route}"' in routes
    assert routes.count("path:") == len(expected)


def test_metadata_page_orders_progress_before_fetch_quotes_action() -> None:
    page = (WEB_ROOT / "src" / "pages" / "metadata-filter.tsx").read_text(
        encoding="utf-8"
    )
    assert "Fetch quotes" in page
    assert 'requestJson<LoadQuotesResponse>("/api/data/load-selected-isins"' in page
    assert page.index("<progress") < page.index("quote-fetch__action")
    assert page.index("quote-fetch__action") < page.index("Fetch quotes")


def test_vite_build_is_the_canonical_web_runtime() -> None:
    package = json.loads((WEB_ROOT / "package.json").read_text(encoding="utf-8"))
    dockerfile = (WEB_ROOT / "Dockerfile").read_text(encoding="utf-8")
    server = (WEB_ROOT / "server.js").read_text(encoding="utf-8")
    assert package["scripts"]["build"] == "vite build"
    assert package["scripts"]["typecheck"] == "tsc -p tsconfig.json --noEmit"
    assert "npm ci" in dockerfile
    assert "npm run build" in dockerfile
    assert "COPY --from=build /app/dist ./dist" in dockerfile
    assert "dist" in server


def test_old_web_surfaces_are_absent() -> None:
    forbidden = (
        "compat/" + "legacy",
        "Legacy" + "Shell",
        "render" + "AppShell",
        "renderAuthenticated" + "Shell",
    )
    source = "\n".join(
        path.read_text(encoding="utf-8")
        for path in (WEB_ROOT / "src").rglob("*")
        if path.is_file()
    )
    server = (WEB_ROOT / "server.js").read_text(encoding="utf-8")
    for token in forbidden:
        assert token not in source
        assert token not in server
''',
              encoding="utf-8",
          )

          forbidden = (
              "fetch_all_isins",
              "fetch-all-isins",
              "compat/legacy",
              "LegacyShell",
              "renderAppShell",
              "renderAuthenticatedShell",
              "read_legacy_bivariate_pair",
          )
          scan_roots = [Path("apps"), Path("src"), Path("tests"), Path("docs")]
          scan_files = [Path("README.md"), Path("ARCHITECTURE.md"), Path("CONTRACTS.md")]
          candidates: list[Path] = []
          for root in scan_roots:
              if root.exists():
                  candidates.extend(path for path in root.rglob("*") if path.is_file())
          candidates.extend(path for path in scan_files if path.exists())
          for token in forbidden:
              offenders: list[str] = []
              for path in candidates:
                  try:
                      content = path.read_text(encoding="utf-8")
                  except UnicodeDecodeError:
                      continue
                  if token in content:
                      offenders.append(str(path))
              if offenders:
                  raise RuntimeError(f"forbidden legacy token {token!r} remains in: {offenders}")
          PY

      - name: Lock and validate frontend
        working-directory: apps/web
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci
          npm run typecheck
          npm run build

      - name: Validate Python and repository contracts
        run: |
          uv sync --locked
          uv run ruff check src tests
          uv run ruff format --check src tests
          uv run pytest \
            tests/test_fetch_all_metadata.py \
            tests/test_workflows.py \
            tests/test_hosted_api.py \
            tests/test_web_react_scaffold.py \
            tests/test_hosted_web_ui.py \
            tests/test_hosted_runtime_compose.py \
            tests/test_entrypoints.py -q

      - name: Commit generated migration
        run: |
          git config user.name 'Portfell Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'refactor(web): rename metadata fetch and add quote progress [agent-generated]'
          git push origin HEAD:agent/fetch-all-metadata
