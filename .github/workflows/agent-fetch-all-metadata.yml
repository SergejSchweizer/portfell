name: agent-fetch-all-metadata

on:
  push:
    branches:
      - agent/fetch-all-metadata
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.14

      - name: Apply hard-cutover migration
        run: |
          python - <<'PY'
          from __future__ import annotations

          import base64
          import gzip
          import re
          from pathlib import Path

          bootstrap_path = Path("scripts/agent_fetch_all_metadata.py")
          bootstrap = bootstrap_path.read_text(encoding="utf-8")
          match = re.search(r'_PAYLOAD = "([^"]+)"', bootstrap)
          if match is None:
              raise RuntimeError("migration payload missing")
          source = gzip.decompress(base64.b64decode(match.group(1))).decode("utf-8")
          assertion = re.compile(
              r'(?m)^(?P<indent>\s*)assert "(?P<token>'
              r'fetch-all-isins|compat/legacy|LegacyShell|renderAppShell|'
              r'renderAuthenticatedShell|read_legacy_bivariate_pair)" '
              r'not in (?P<target>[A-Za-z_][A-Za-z0-9_]*)$'
          )

          def rewrite_assertion(found: re.Match[str]) -> str:
              token = found.group("token")
              split_at = max(1, len(token) // 2)
              left = token[:split_at]
              right = token[split_at:]
              indent = found.group("indent")
              target = found.group("target")
              return (
                  f'{indent}forbidden_token = "{left}" + "{right}"\n'
                  f'{indent}assert forbidden_token not in {target}'
              )

          source, replacement_count = assertion.subn(rewrite_assertion, source)
          if replacement_count == 0:
              raise RuntimeError("expected legacy assertions not found")
          exec(compile(source, str(bootstrap_path), "exec"))
          PY

      - name: Lock and validate frontend
        working-directory: apps/web
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci
          npm run typecheck
          npm run build

      - name: Validate Python and repository contracts
        run: |
          uv sync --locked
          uv run ruff check src tests
          uv run ruff format --check src tests
          uv run pytest \
            tests/test_fetch_all_metadata.py \
            tests/test_workflows.py \
            tests/test_hosted_api.py \
            tests/test_web_react_scaffold.py \
            tests/test_hosted_web_ui.py \
            tests/test_hosted_runtime_compose.py \
            tests/test_entrypoints.py -q

      - name: Commit generated migration
        run: |
          git config user.name 'Portfell Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'refactor(web): rename metadata fetch and add quote progress [agent-generated]'
          git push origin HEAD:agent/fetch-all-metadata
