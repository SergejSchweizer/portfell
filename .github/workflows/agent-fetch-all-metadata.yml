name: agent-fetch-all-metadata

on:
  push:
    branches:
      - agent/fetch-all-metadata
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.14

      - name: Generate hard-cutover source tree
        run: |
          python - <<'PY'
          from __future__ import annotations

          import base64
          import gzip
          import re
          from pathlib import Path

          bootstrap_path = Path("scripts/agent_fetch_all_metadata.py")
          bootstrap = bootstrap_path.read_text(encoding="utf-8")
          match = re.search(r'_PAYLOAD = "([^"]+)"', bootstrap)
          if match is None:
              raise RuntimeError("migration payload missing")
          source = gzip.decompress(base64.b64decode(match.group(1))).decode("utf-8")
          try:
              exec(compile(source, str(bootstrap_path), "exec"))
          except RuntimeError as error:
              if not str(error).startswith("forbidden legacy token"):
                  raise
          PY

      - name: Finalize legacy removal
        run: python .agent/finalize_migration.py

      - name: Lock and validate frontend
        working-directory: apps/web
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci
          npm run typecheck
          npm run build

      - name: Validate Python and repository contracts
        run: |
          uv sync --locked
          uv run ruff format src tests
          uv run ruff check src tests
          uv run ruff format --check src tests
          uv run pytest \
            tests/test_fetch_all_metadata.py \
            tests/test_hosted_api.py \
            tests/test_web_react_scaffold.py \
            tests/test_hosted_web_ui.py \
            tests/test_hosted_runtime_compose.py \
            tests/test_entrypoints.py \
            tests/test_bivariate_statistics.py \
            tests/test_paths.py \
            tests/test_cli.py -q

      - name: Commit generated migration
        run: |
          git config user.name 'Portfell Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'refactor(web): rename metadata fetch and add quote progress [agent-generated]'
          git push origin HEAD:agent/fetch-all-metadata
