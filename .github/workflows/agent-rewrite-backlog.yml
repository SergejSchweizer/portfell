name: agent-rewrite-backlog

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/rewrite_backlog_four_page_ui.py
      - .github/workflows/agent-rewrite-backlog.yml

permissions:
  contents: write

jobs:
  rewrite:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Rewrite backlog
        run: python scripts/rewrite_backlog_four_page_ui.py

      - name: Verify structure
        run: |
          python - <<'PY'
          from pathlib import Path

          text = Path('BACKLOG.md').read_text(encoding='utf-8')
          required = [
              '## Active Four-Page Portfell UI PR Stack',
              '### PR110. Canonical Workflow State And Four-Page API Contract',
              '### PR111. Metadata Header, Metadata Filter, And Real Quote Progress',
              '### PR112. Functional Univariate Statistics Page',
              '### PR113. Functional Univariate Filter Page',
              '### PR114. Functional Bivariate Statistics Page',
              '### PR115. Sequential Navigation, Final Legacy Deletion, And End-To-End Gate',
              '## Completed PR History',
              '## Completed And Superseded Detailed Records',
          ]
          for value in required:
              if value not in text:
                  raise SystemExit(f'missing required backlog section: {value}')
          if text.index('## Completed PR History') < text.index('## Active Four-Page Portfell UI PR Stack'):
              raise SystemExit('completed history must remain below active work')
          if 'Data -> Metadata -> Univariate -> Filter -> Diversification -> Portfolio -> Validation -> Report' in text.split('## Completed And Superseded Detailed Records', 1)[0]:
              raise SystemExit('superseded eight-stage UI remains active')
          PY
          git diff --check

      - name: Publish rewritten backlog
        run: |
          git config user.name 'Portfell Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add BACKLOG.md
          git commit -m 'docs: define atomic four-page UI backlog'
          git push origin HEAD:${{ github.head_ref }}
