name: merge-gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTEST_SHARD_COUNT: 4

jobs:
  merge-lint-quality:
    name: merge-lint-quality
    runs-on: [self-hosted, Linux, X64, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install
      - name: Install dependencies
        run: uv sync --dev
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Architecture and import boundaries
        run: uv run python -m portfell.architecture_checks
      - name: Dataset schema registry
        run: uv run python -m portfell.schema_validation
      - name: Hosted security gates
        run: uv run python -m portfell.security_gates
      - name: Validate branch commit subjects
        run: uv run portfell-quality --commits-only
      - name: Verify tracked working tree stays clean
        run: |
          git diff --quiet
          git diff --cached --quiet

  merge-type-quality:
    name: merge-type-quality
    runs-on: [self-hosted, Linux, X64, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install
      - name: Install dependencies
        run: uv sync --dev
      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24

      - name: Pyright
        run: uv run pyright

  merge-dash-browser:
    name: merge-dash-browser
    runs-on: [self-hosted, Linux, X64, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install
      - name: Install dependencies
        run: uv sync --dev
      - name: Install Chromium
        run: uv run playwright install --with-deps chromium
      - name: Run Dash parity acceptance
        env:
          PORTFELL_DASH_PARITY_EVIDENCE_DIR: ${{ github.workspace }}/artifacts/dash-parity-v1
        run: uv run pytest -m browser tests/browser -q
      - name: Upload Dash parity evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dash-parity-v1
          path: artifacts/dash-parity-v1
          if-no-files-found: ignore
          retention-days: 14

  merge-unit-tests:
    name: merge-unit-tests-${{ matrix.shard }}
    runs-on: [self-hosted, Linux, X64, ubuntu-latest]
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install
      - name: Install dependencies
        run: uv sync --dev
      - name: Unit test shard with coverage
        env:
          COVERAGE_FILE: .coverage.unit.${{ matrix.shard }}
        run: >-
          uv run python scripts/pytest_shard.py
          --suite unit
          --shard-index ${{ matrix.shard }}
          --shard-count ${PYTEST_SHARD_COUNT}
          --
          -q
          -n auto
          --cov=portfell
          --cov-report=
          --cov-fail-under=0
      - name: Upload coverage shard
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-unit-${{ matrix.shard }}
          path: .coverage.unit.${{ matrix.shard }}
          include-hidden-files: true

  merge-integration-tests:
    name: merge-integration-tests-${{ matrix.shard }}
    runs-on: [self-hosted, Linux, X64, ubuntu-latest]
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install
      - name: Install dependencies
        run: uv sync --dev
      - name: Integration test shard with coverage
        env:
          COVERAGE_FILE: .coverage.integration.${{ matrix.shard }}
        run: >-
          uv run python scripts/pytest_shard.py
          --suite integration
          --shard-index ${{ matrix.shard }}
          --shard-count ${PYTEST_SHARD_COUNT}
          --
          -q
          -n auto
          --cov=portfell
          --cov-report=
          --cov-fail-under=0
      - name: Upload coverage shard
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-integration-${{ matrix.shard }}
          path: .coverage.integration.${{ matrix.shard }}
          include-hidden-files: true

  merge-gate:
    name: merge-gate
    runs-on: [self-hosted, Linux, X64, ubuntu-latest]
    needs:
      - merge-lint-quality
      - merge-type-quality
      - merge-dash-browser
      - merge-unit-tests
      - merge-integration-tests
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install
      - name: Install dependencies
        run: uv sync --dev
      - name: Download coverage shards
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: coverage-*
          path: coverage-shards
          merge-multiple: true
      - name: Verify merge gate jobs
        env:
          LINT_RESULT: ${{ needs.merge-lint-quality.result }}
          TYPE_RESULT: ${{ needs.merge-type-quality.result }}
          DASH_BROWSER_RESULT: ${{ needs.merge-dash-browser.result }}
          UNIT_RESULT: ${{ needs.merge-unit-tests.result }}
          INTEGRATION_RESULT: ${{ needs.merge-integration-tests.result }}
        run: |
          if [[ "$LINT_RESULT" != "success" || "$TYPE_RESULT" != "success" || "$DASH_BROWSER_RESULT" != "success" || "$UNIT_RESULT" != "success" || "$INTEGRATION_RESULT" != "success" ]]; then
            echo "merge-gate failed: lint=$LINT_RESULT type=$TYPE_RESULT dash_browser=$DASH_BROWSER_RESULT unit=$UNIT_RESULT integration=$INTEGRATION_RESULT" >&2
            exit 1
          fi
          echo "merge-gate prerequisites passed."
      - name: Combine coverage and enforce threshold
        run: |
          uv run coverage combine coverage-shards
          uv run coverage report --fail-under=90

  structural-risk-v2-evidence:
    name: structural-risk-v2-evidence
    runs-on: [self-hosted, Linux, X64, ubuntu-latest]
    needs: [merge-gate]
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'test/pr381-structural-risk-v2-production-closeout' &&
      needs.merge-gate.result == 'success'
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install
      - name: Install dependencies
        run: uv sync --dev
      - name: Assemble immutable Structural-risk v2 PASS evidence
        env:
          PORTFELL_EVIDENCE_SHA: ${{ github.event.pull_request.head.sha }}
          PORTFELL_STRUCTURAL_RISK_EVIDENCE_DIR: ${{ github.workspace }}/artifacts/structural-risk-v2
        run: uv run python scripts/build_structural_risk_v2_ci_evidence.py
      - name: Upload Structural-risk v2 PASS evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: structural-risk-v2
          path: artifacts/structural-risk-v2/structural-risk-v2.json
          if-no-files-found: error
          retention-days: 30
