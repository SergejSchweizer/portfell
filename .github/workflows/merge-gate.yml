name: merge-gate

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  PYTEST_SHARD_COUNT: 4

jobs:
  lint:
    name: merge-lint-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: astral-sh/setup-uv@v6
      - run: uv python install
      - run: uv sync --dev
      - run: uv pip install --python .venv/bin/python --requirement apps/api/requirements-ui.txt
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python -m portfell.architecture_checks
      - run: uv run python -m portfell.schema_validation
      - run: uv run python -m portfell.security_gates
      - run: uv run portfell-quality --commits-only
      - run: git diff --quiet && git diff --cached --quiet

  type:
    name: merge-type-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install
      - run: uv sync --dev
      - run: uv pip install --python .venv/bin/python --requirement apps/api/requirements-ui.txt
      - run: uv run pyright

  unit:
    name: merge-unit-tests-${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: {shard: [1, 2, 3, 4]}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install
      - run: uv sync --dev
      - run: uv pip install --python .venv/bin/python --requirement apps/api/requirements-ui.txt
      - run: COVERAGE_FILE=.coverage.unit-${{ matrix.shard }} uv run python scripts/pytest_shard.py --suite unit --shard-index ${{ matrix.shard }} --shard-count 4 -- -q -n auto --cov=portfell --cov-report=
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-unit-${{ matrix.shard }}
          path: .coverage.unit-${{ matrix.shard }}
          include-hidden-files: true

  integration:
    name: merge-integration-tests-${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: {shard: [1, 2, 3, 4]}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install
      - run: uv sync --dev
      - run: uv pip install --python .venv/bin/python --requirement apps/api/requirements-ui.txt
      - run: COVERAGE_FILE=.coverage.integration-${{ matrix.shard }} uv run python scripts/pytest_shard.py --suite integration --shard-index ${{ matrix.shard }} --shard-count 4 -- -q -n auto --cov=portfell --cov-report=
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-integration-${{ matrix.shard }}
          path: .coverage.integration-${{ matrix.shard }}
          include-hidden-files: true

  app-image:
    name: merge-dash-app-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --file apps/api/Dockerfile --tag portfell-app:merge .
      - run: docker compose config --quiet

  aggregate:
    name: merge-gate
    if: always()
    needs: [lint, type, unit, integration, app-image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install
      - run: uv sync --dev
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage-shards
          merge-multiple: true
      - name: Enforce 95 percent combined coverage
        run: |
          uv run coverage combine coverage-shards
          uv run coverage report --fail-under=95
      - name: Require every parallel gate
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          test "$(echo "$RESULTS" | tr ' ' '\n' | grep -vc '^success$')" -eq 0
