name: agent-portfell-repository-rename

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/agent_portfell_repository_rename.py
      - .github/workflows/agent-portfell-repository-rename.yml

permissions:
  contents: write

jobs:
  rename:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.14

      - name: Apply repository namespace cutover
        run: python scripts/agent_portfell_repository_rename.py

      - name: Resolve Python lock and dependencies
        run: |
          uv lock
          uv sync --group dev

      - name: Validate Python source
        run: |
          uv run ruff format .
          uv run ruff check .
          uv run ruff format --check .
          uv run pyright
          uv run lint-imports
          uv run pytest -q

      - name: Validate React application
        working-directory: apps/web
        run: |
          npm ci
          npm run typecheck
          npm run build
          node --check server.js

      - name: Remove generated artifacts
        run: |
          rm -rf .venv apps/web/node_modules apps/web/dist

      - name: Verify complete cutover
        run: |
          git add -A
          if git ls-files | grep -i 'camovar'; then
            echo 'Old repository name remains in a tracked path.' >&2
            exit 1
          fi
          if git grep --cached -n -i 'camovar'; then
            echo 'Old repository name remains in tracked content.' >&2
            exit 1
          fi
          git diff --cached --check
          git status --short

      - name: Publish validated migration
        run: |
          git config user.name 'Portfell Agent'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'refactor: complete Portfell namespace cutover'
          git push origin HEAD:${{ github.head_ref }}
